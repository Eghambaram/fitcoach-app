name: CI

on:
  pull_request:
  push:
    branches: [main, "step/**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# PROMPT §17.4: PR checks. Railway deploys staging from main only when these pass ("Wait for CI").
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      # Both suites start their own Postgres (and RustFS) with Testcontainers.
      - name: DB / RLS tests (Testcontainers)
        run: pnpm test:db

      - name: API integration tests (Testcontainers)
        run: pnpm test:api

      - name: Build
        run: pnpm build

  # Playwright against the Docker images Railway runs (docker compose --profile full).
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      TURBO_TELEMETRY_DISABLED: "1"
      # CI-only values; never real secrets. Compose reads them too, so the host CLI used by the
      # Playwright global setup (`pnpm beta:invite`) and the API container share them.
      APP_ENV: test
      SESSION_SECRET: ci-session-secret-0123456789abcdef0123
      IP_HASH_SALT: ci-ip-hash-salt-0123456789abcdef
      APP_ENCRYPTION_KEY: Y2ktZW5jcnlwdGlvbi1rZXktMDEyMzQ1Njc4OWFiY2Q=
      DB_APP_PASSWORD: ci-app-password
      DB_SYSTEM_PASSWORD: ci-system-password
      DATABASE_SYSTEM_URL: postgres://fitcoach_system:ci-system-password@localhost:5432/fitcoach
      E2E_EXTERNAL_SERVERS: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The beta-invite CLI imports the shared package from its build output.
      - name: Build shared package
        run: pnpm turbo run build --filter=@fitcoach/shared

      - name: Build images and start the stack (migrations run first)
        run: docker compose --profile full up -d --build --wait

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E (desktop + mobile)
        run: pnpm test:e2e

      # The in-API nightly backup (ADR-0064): queue one run in the API container, expect a good dump.
      - name: In-API nightly backup
        run: |
          docker compose exec -T api node -e "const {PgBoss}=require('pg-boss'); const b=new PgBoss({connectionString:process.env.DATABASE_SYSTEM_URL,schema:'pgboss',migrate:false,createSchema:false}); b.start().then(()=>b.send('backups.run',{})).then(()=>b.stop({graceful:false,close:true}))"
          for attempt in $(seq 1 30); do
            status="$(docker compose exec -T postgres psql -U postgres -d fitcoach -Atc "select status from backup_runs order by finished_at desc limit 1")"
            [ -n "$status" ] && break
            sleep 2
          done
          echo "in-API backup: $status"
          [ "$status" = "succeeded" ]

      # One run of the nightly backup image against the stack: pg_dump, upload, heartbeat (ADR-0063).
      - name: Nightly backup image
        run: |
          docker compose --profile full --profile backup run --rm db-backup
          docker compose exec -T postgres psql -U postgres -d fitcoach -Atc \
            "select status from backup_runs order by finished_at desc limit 1" | grep -qx succeeded

      - name: Stack logs
        if: failure()
        run: docker compose --profile full logs --no-color --tail 300

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

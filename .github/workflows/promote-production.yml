name: Promote to production

# PROMPT §17.4 step 3: production deploys from the `production` branch. This fast-forwards it to a
# `main` commit that staging has already run and smoke-tested. The `production` GitHub environment
# requires an approval (Settings → Environments → production → Required reviewers), so nothing
# reaches production without someone saying yes. Railway then deploys production; the API migrates
# on start, and "Production smoke" checks the live site.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit on main to release (leave empty for the latest main)"
        required: false
        type: string

concurrency:
  group: promote-production
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Pick the commit
        id: pick
        run: |
          sha="${{ inputs.sha }}"
          if [ -z "$sha" ]; then sha="$(git rev-parse origin/main)"; fi
          sha="$(git rev-parse --verify "$sha^{commit}")"
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::$sha is not on main"; exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Require a green staging smoke for that commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.pick.outputs.sha }}
        run: |
          conclusion="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow staging-smoke.yml \
            --commit "$SHA" --status success --limit 1 --json conclusion --jq '.[0].conclusion')"
          if [ "$conclusion" != "success" ]; then
            echo "::error::No successful Staging smoke run for $SHA. Let staging deploy and pass first."
            exit 1
          fi

      - name: Fast-forward production
        env:
          SHA: ${{ steps.pick.outputs.sha }}
        run: |
          if git rev-parse --verify origin/production >/dev/null 2>&1; then
            if ! git merge-base --is-ancestor origin/production "$SHA"; then
              echo "::error::production has commits that aren't on main; it can only fast-forward."
              exit 1
            fi
          fi
          git push origin "$SHA:refs/heads/production"
          echo "Released $SHA to production." >> "$GITHUB_STEP_SUMMARY"

# Local infrastructure for FitCoach (PROMPT §18). Start: `docker compose up -d`.
# Same interfaces as staging/production: Postgres, SMTP (Mailpit) and S3 (RustFS standing in for Cloudflare R2).
# MinIO no longer publishes container images, so RustFS (MinIO-compatible, same ports) replaces it (ADR-0036).
# Production parity: `docker compose --profile full up -d --build` also builds api + web from their
# Dockerfiles (the images Railway runs); the api container migrates on start. Web on :3000, api on :4000.
# Stop `pnpm dev` first — the ports are the same.
name: fitcoach

services:
  postgres:
    # Postgres 17 until the Railway service's major version is confirmed (ADR-0027).
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fitcoach
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fitcoach"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.31.6
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # web UI — http://localhost:8025

  storage:
    image: rustfs/rustfs:1.0.3
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: localaccesskey
      RUSTFS_SECRET_KEY: localsecretkey
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # console — http://localhost:9001/rustfs/console/ (localaccesskey / localsecretkey)
    volumes:
      - storagedata:/data

  # One-shot job: creates both local buckets with the AWS CLI (the same S3 API the app uses);
  # the public bucket gets anonymous read to mimic the R2 custom domain.
  storage-init:
    image: amazon/aws-cli:2.38.2
    depends_on:
      - storage
    restart: "no"
    environment:
      AWS_ACCESS_KEY_ID: localaccesskey
      AWS_SECRET_ACCESS_KEY: localsecretkey
      AWS_DEFAULT_REGION: us-east-1
    entrypoint:
      - /bin/sh
      - -c
      - |
        s3() { aws --endpoint-url http://storage:9000 "$$@"; }
        until s3 s3api list-buckets >/dev/null 2>&1; do echo "waiting for storage..."; sleep 1; done
        for bucket in fitcoach-local-private fitcoach-local-public; do
          s3 s3api head-bucket --bucket "$$bucket" >/dev/null 2>&1 || s3 s3api create-bucket --bucket "$$bucket"
        done
        s3 s3api put-bucket-policy --bucket fitcoach-local-public --policy '{
          "Version": "2012-10-17",
          "Statement": [{
            "Effect": "Allow",
            "Principal": {"AWS": ["*"]},
            "Action": ["s3:GetObject"],
            "Resource": ["arn:aws:s3:::fitcoach-local-public/*"]
          }]
        }'
        echo "storage buckets ready"

  # ---- profile "full": the Railway images, run locally (PROMPT §17.2, §18) ----

  # Migrates on start (the image's CMD, as on Railway), then serves.
  api:
    profiles: [full]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: fitcoach-api:local
    restart: unless-stopped
    environment:
      # "test": production build and JSON logs, but cookies without Secure over http://localhost.
      APP_ENV: test
      PORT: "4000"
      LOG_LEVEL: info
      WEB_ORIGIN: http://localhost:3000
      DATABASE_OWNER_URL: postgres://postgres:postgres@postgres:5432/fitcoach
      # Must match .env: migrations reset the role passwords that `pnpm dev` also uses.
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:-fitcoach-app-local}
      DB_SYSTEM_PASSWORD: ${DB_SYSTEM_PASSWORD:-fitcoach-system-local}
      DATABASE_URL: postgres://fitcoach_app:${DB_APP_PASSWORD:-fitcoach-app-local}@postgres:5432/fitcoach
      DATABASE_SYSTEM_URL: postgres://fitcoach_system:${DB_SYSTEM_PASSWORD:-fitcoach-system-local}@postgres:5432/fitcoach
      # Same secrets as .env, so host CLIs (`pnpm beta:invite`) issue codes this API accepts.
      SESSION_SECRET: ${SESSION_SECRET:-local-dev-session-secret-not-secret-0123456789}
      IP_HASH_SALT: ${IP_HASH_SALT:-local-dev-ip-hash-salt-not-secret}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-bG9jYWwtZGV2LWVuY3J5cHRpb24ta2V5LW5vdC1zZWM=}
      SIGNUP_MODE: invite_code
      EMAIL_PROVIDER: smtp
      SMTP_URL: smtp://mailpit:1025
      EMAIL_FROM: FitCoach <noreply@fitcoach.local>
      STORAGE_ENDPOINT: http://storage:9000
      STORAGE_REGION: us-east-1
      STORAGE_ACCESS_KEY_ID: localaccesskey
      STORAGE_SECRET_ACCESS_KEY: localsecretkey
      STORAGE_PRIVATE_BUCKET: fitcoach-local-private
      STORAGE_PUBLIC_BUCKET: fitcoach-local-public
      # Read by browsers, so the host address rather than the compose service name.
      STORAGE_PUBLIC_BASE_URL: http://localhost:9000/fitcoach-local-public
    ports:
      - "4000:4000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:4000/v1/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
      storage-init:
        condition: service_completed_successfully

  web:
    profiles: [full]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: http://localhost:3000
        NEXT_PUBLIC_APP_ENV: test
        NEXT_PUBLIC_BETA_CONTACT_EMAIL: getfitcoach.app@gmail.com
    image: fitcoach-web:local
    restart: unless-stopped
    environment:
      # The API over the private network, as on Railway (api.RAILWAY_PRIVATE_DOMAIN).
      API_INTERNAL_URL: http://api:4000
      HOSTNAME: "::"
      PORT: "3000"
    ports:
      - "3000:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  storagedata:
